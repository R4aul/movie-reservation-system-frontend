<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white p-6">

  <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-8">

    <!-- Título -->
    <h2 class="text-3xl font-bold text-center mb-6">
      Crear cuenta
    </h2>

    <!-- Formulario -->
    <form class="space-y-5" (ngSubmit)="onSubmit()">

      <!-- Nombre -->
      <div>
        <label class="block mb-1 text-sm">Nombre</label>
        <input
          type="text"
          placeholder="Tu nombre"
          name="name"
          [(ngModel)]="request.name"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-1 text-sm">Correo electrónico</label>
        <input
          type="email"
          placeholder="ejemplo@email.com"
          name="email"
          [(ngModel)]="request.email"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-1 text-sm">Contraseña</label>
        <input
          type="password"
          placeholder="********"
          name="password"
          [(ngModel)]="request.password"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block mb-1 text-sm">Confirmar contraseña</label>
        <input
          type="password"
          placeholder="********"
          name="password_confirm"
          [(ngModel)]="password_confirm"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      @if (errorPassword) {
        <p class="text-red-500 text-sm mt-1">
          {{ errorPassword }}
        </p>
      }

      <!-- Botón -->
      <button
        type="submit"
        class="w-full bg-red-600 hover:bg-red-700 transition py-2 rounded-lg font-semibold"
      >
        Registrarse
      </button>

    </form>

    <!-- Link -->
    <p class="text-sm text-gray-400 mt-6 text-center">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-red-500 hover:underline">
        Inicia sesión
      </a>
    </p>

  </div>

</div>
