<nav class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <!-- Logo -->
    <div class="flex items-center gap-2">
      <span class="text-2xl">🎬</span>
      <span class="text-xl font-bold text-gray-800">
        CineApp
      </span>
    </div>

    <!-- Links -->
    <div class="hidden md:flex gap-6 text-gray-600 font-medium">
      <a routerLink="/" class="hover:text-blue-600 transition">
        Cartelera
      </a>

      <a routerLink="/reservas" class="hover:text-blue-600 transition">
        Mis reservas
      </a>
    </div>

    <!-- Usuario -->
    <div class="flex items-center gap-4">

      <!-- Si está logueado -->
      <ng-container *ngIf="user; else guest">

        <span class="text-gray-700 font-medium">
          👤 {{ user.name }}
        </span>

        <button
          (click)="logout()"
          class="bg-red-500 text-white px-4 py-2 rounded-xl hover:bg-red-600 transition"
        >
          Logout
        </button>

      </ng-container>

      <!-- Si NO está logueado -->
      <ng-template #guest>
        <a
          routerLink="/login"
          class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition"
        >
          Login
        </a>
      </ng-template>

    </div>

  </div>
</nav>
